[program:finance-backend-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/finance_backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/finance_backend/storage/logs/worker.log
stopwaitsecs=3600

; High priority queue worker for notifications
[program:finance-backend-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/finance_backend/artisan queue:work database --queue=high,default --sleep=3 --tries=3 --max-time=3600 --timeout=60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/finance_backend/storage/logs/worker-high.log
stopwaitsecs=3600
